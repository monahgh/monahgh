<svg width="900" height="783" viewBox="0 0 900 783" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured projects. GCP CI/CD pipeline on GKE: push-to-deploy on Google Cloud. A merged PR to main triggers Cloud Build, which builds the Docker image, pushes it to the registry and deploys it to a dedicated GKE namespace, with a separate dev environment for testing changes before production. Stack: GCP, GKE, Cloud Build, Docker, Kubernetes. PostgreSQL operations on AWS RDS: tuning, HA and recoverability. Multi-AZ RDS PostgreSQL with a read replica, run through hands-on tuning, partitioning and vacuum labs. Scripts test Multi-AZ failover and validate backups by restoring a snapshot and checking a canary row. Access is through Session Manager only, with no SSH or open ports. Stack: AWS, Terraform, RDS, PostgreSQL, Systems Manager, CloudWatch. Three-tier app: ECS Fargate + Aurora: pooling, read/write split, failover. CloudFront in front of a private S3 site and an ALB that only accepts CloudFront traffic. The ECS Fargate API splits reads and writes across an RDS Proxy in front of Aurora Serverless v2, and failover is compared through the cluster endpoint and through the proxy. Stack: AWS, Terraform, ECS Fargate, Aurora, RDS Proxy, CloudFront, Lambda. EKS + CloudNativePG + serverless: Postgres on Kubernetes vs managed RDS. An EKS cluster on Graviton with access entries and Pod Identity runs PostgreSQL in Kubernetes (CloudNativePG, one instance per AZ) next to Multi-AZ RDS. Around them are an API Gateway + Lambda API and an EventBridge → Lambda → SNS audit pipeline. Stack: AWS, Terraform, EKS, Kubernetes, CloudNativePG, Lambda, EventBridge.">
